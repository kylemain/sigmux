name: Publish to PyPI

# Fires on a version tag (e.g. `git tag v0.3.1 && git push origin v0.3.1`).
# Uses PyPI Trusted Publishing (OIDC) -- no API token stored in this repo.
# Also has a manual workflow_dispatch fallback: the tag-push trigger has
# not always fired reliably (seen on detectl's identical setup, cause
# never root-caused), so if a tag push doesn't kick off a run within a
# minute or so, trigger it by hand from the Actions tab instead.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
