title: Svchost Beaconing to Known C2 Listener Ports
id: 8a9f0a2e-11f1-4c11-9e21-example00006
status: experimental
description: >
  Detects svchost.exe (a common LOLBin for hiding C2 traffic) making an
  outbound connection to a port frequently used by off-the-shelf C2
  frameworks.
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: Kyle Main
date: 2026/08/14
tags:
  - attack.command_and_control
  - attack.t1071.001
logsource:
  category: network_connection
  product: windows
detection:
  selection_port:
    DestinationPort:
      - 4444
      - 8443
      - 8080
  selection_proc:
    Image|endswith: '\svchost.exe'
  condition: all of them
falsepositives:
  - Internal tooling or proxies legitimately using these ports
level: medium
