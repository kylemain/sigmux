title: Living-off-the-Land Recon Command Keywords
id: 8a9f0a2e-11f1-4c11-9e21-example00009
status: experimental
description: >
  Detects command lines containing common built-in Windows recon commands
  frequently chained together during manual post-exploitation discovery.
references:
  - https://attack.mitre.org/techniques/T1082/
author: Kyle Main
date: 2026/08/14
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  keywords:
    - 'whoami /priv'
    - 'net group "domain admins" /domain'
    - 'nltest /domain_trusts'
  condition: keywords
falsepositives:
  - Legitimate sysadmin troubleshooting sessions
level: low
