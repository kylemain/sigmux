title: AWS Root Account Console Login
id: 8a9f0a2e-11f1-4c11-9e21-example00004
status: stable
description: >
  Detects an interactive console login using the AWS account root user,
  which should almost never happen in a well-managed account.
references:
  - https://attack.mitre.org/techniques/T1078/004/
author: Kyle Main
date: 2026/08/09
tags:
  - attack.initial_access
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: ConsoleLogin
    userIdentity.type: Root
  condition: selection
level: medium
