title: Suspicious PowerShell Encoded Command Execution
id: 8a9f0a2e-11f1-4c11-9e21-example00001
status: experimental
description: >
  Detects PowerShell invoked with an encoded command argument, a common
  technique for obfuscating malicious payloads and evading simple string
  matching.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Kyle Main
date: 2026/08/09
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    CommandLine|contains:
      - '-enc'
      - '-EncodedCommand'
  condition: selection_image and selection_flag
falsepositives:
  - Legitimate admin scripts that pass encoded commands
level: high
