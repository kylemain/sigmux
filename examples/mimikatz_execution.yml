title: Mimikatz Process Execution
id: 8a9f0a2e-11f1-4c11-9e21-example00002
status: stable
description: Detects execution of Mimikatz or common renamed variants via command-line indicators.
references:
  - https://attack.mitre.org/software/S0002/
author: Kyle Main
date: 2026/08/09
tags:
  - attack.credential_access
  - attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection_name:
    Image|endswith: '\mimikatz.exe'
  selection_cli:
    CommandLine|contains:
      - 'sekurlsa::'
      - 'lsadump::'
      - 'privilege::debug'
  condition: 1 of selection_*
level: critical
