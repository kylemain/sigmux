title: Azure AD Sign-In Flagged as Impossible Travel
id: 8a9f0a2e-11f1-4c11-9e21-example00007
status: experimental
description: >
  Flags a successful Azure AD interactive sign-in tagged by Identity
  Protection as impossible travel -- two geographically distant sign-ins
  for the same account too close together to be a real trip.
references:
  - https://attack.mitre.org/techniques/T1078/004/
author: Kyle Main
date: 2026/08/14
tags:
  - attack.initial_access
  - attack.t1078.004
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    ResultType: 0
    RiskEventTypes|contains: 'unlikelyTravel'
  condition: selection
level: high
