title: Registry Run Key Persistence via Suspicious Directory
id: 8a9f0a2e-11f1-4c11-9e21-example00005
status: experimental
description: >
  Detects a new value added to a Run/RunOnce registry key that points to an
  executable staged in a world-writable or unusual directory, a common
  persistence technique.
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: Kyle Main
date: 2026/08/14
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_event
  product: windows
detection:
  selection_key:
    TargetObject|contains:
      - '\Software\Microsoft\Windows\CurrentVersion\Run'
      - '\Software\Microsoft\Windows\CurrentVersion\RunOnce'
  selection_path:
    Details|startswith:
      - 'C:\Users\Public\'
      - 'C:\ProgramData\'
      - 'C:\Windows\Temp\'
  condition: all of selection_*
falsepositives:
  - Legitimate installers that stage binaries in ProgramData before registering autorun
level: high
